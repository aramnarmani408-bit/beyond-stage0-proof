# BEYOND X stage 7: cloud-build one Godot game (web + debug APK).
name: Games build (web + Android)
on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Game id under beyond-x/games/
        required: true
        type: string
permissions:
  contents: write
env:
  GODOT_VERSION: 4.5.2
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_DIR: beyond-x/games/${{ inputs.game_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager "build-tools;35.0.0" "platforms;android-35"
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Configure Android export
        run: |
          mkdir -p ~/.config/godot
          touch /tmp/android-export.log
          keytool -genkey -keystore /tmp/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "/tmp/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.tres
      - name: Import project
        working-directory: ${{ env.GAME_DIR }}
        run: godot --headless --path . --import
      - name: Export web
        working-directory: ${{ env.GAME_DIR }}
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Export Android debug APK
        working-directory: ${{ env.GAME_DIR }}
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/game-${{ inputs.game_id }}-debug.apk > /tmp/android-export.log 2>&1
      - name: Verify outputs
        run: |
          ls -la $GAME_DIR/build/web $GAME_DIR/build/android
          test -s $GAME_DIR/build/web/index.html
          test -s $GAME_DIR/build/web/*.wasm
          test -s $GAME_DIR/build/web/*.pck
          test -s $GAME_DIR/build/android/game-${{ inputs.game_id }}-debug.apk
          file $GAME_DIR/build/android/game-${{ inputs.game_id }}-debug.apk
          sha256sum $GAME_DIR/build/web/* $GAME_DIR/build/android/*.apk
      - name: Commit web export
        run: |
          mkdir -p $GAME_DIR/web
          cp -r $GAME_DIR/build/web/. $GAME_DIR/web/
          git config user.name "beyond-ai-builder"
          git config user.email "builder@beyondx.local"
          git add $GAME_DIR/web
          git commit -m "BEYOND X game ${{ inputs.game_id }} web export" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push origin main
      - name: Publish game pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd $GAME_DIR
          zip -qr game-web.zip build/web
          gh release create games-${{ inputs.game_id }}-run-${{ github.run_number }} --prerelease --title "Game ${{ inputs.game_id }} run ${{ github.run_number }}" --notes "Cloud-built Godot game: web export + debug APK." game-web.zip build/android/game-${{ inputs.game_id }}-debug.apk
      - name: Collect failure diagnostics
        if: failure()
        run: |
          { echo "ANDROID_HOME=$ANDROID_HOME"; echo "JAVA_HOME=$JAVA_HOME"; ls "$ANDROID_HOME/build-tools"; ls "$ANDROID_HOME/platforms"; cat ~/.config/godot/editor_settings-4.tres; echo ---LOG---; tail -n 150 /tmp/android-export.log; } > /tmp/godot-diag.txt 2>&1
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create games-${{ inputs.game_id }}-fail-${{ github.run_number }} --prerelease --title "Game ${{ inputs.game_id }} failure ${{ github.run_number }}" --notes "Diagnostics." /tmp/godot-diag.txt
