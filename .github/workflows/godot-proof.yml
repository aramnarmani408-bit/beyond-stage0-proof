# Godot proof: cloud-build a minimal Godot 4.5 game to web + debug APK.
# Route: chickensoft setup-godot@v2 + export templates. Web export has
# thread support OFF (no COOP/COEP headers needed). Android uses the
# prebuilt template (no Gradle build template needed for a debug APK).
# Triggered by pushes to the proof project or this file; dispatchable.
name: Godot proof (web + Android)
on:
  push:
    paths: [beyond-x/godot-proof/**, .github/workflows/godot-proof.yml]
  workflow_dispatch:
permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with: {version: ${{ env.GODOT_VERSION }}, use-dotnet: false, include-templates: true}
      - name: Check Godot version
        run: godot --version
      - name: Configure Android export
        run: |
          mkdir -p ~/.config/godot
          keytool -genkey -keystore /tmp/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "/tmp/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.tres
          cat ~/.config/godot/editor_settings-4.tres
      - name: Import project
        working-directory: beyond-x/godot-proof
        run: godot --headless --path . --import
      - name: Export web
        working-directory: beyond-x/godot-proof
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Export Android debug APK
        working-directory: beyond-x/godot-proof
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/godot-proof-debug.apk
      - name: Verify outputs
        run: |
          ls -la beyond-x/godot-proof/build/web beyond-x/godot-proof/build/android
          test -s beyond-x/godot-proof/build/web/index.html
          test -s beyond-x/godot-proof/build/web/*.wasm
          test -s beyond-x/godot-proof/build/web/*.pck
          test -s beyond-x/godot-proof/build/android/godot-proof-debug.apk
          file beyond-x/godot-proof/build/android/godot-proof-debug.apk
          sha256sum beyond-x/godot-proof/build/web/* beyond-x/godot-proof/build/android/*.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-proof-build
          path: |
            beyond-x/godot-proof/build/web
            beyond-x/godot-proof/build/android/godot-proof-debug.apk
          if-no-files-found: error
      - name: Publish proof pre-release
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          cd beyond-x/godot-proof
          zip -qr godot-proof-web.zip build/web
          gh release create godot-proof-run-${{ github.run_number }} --prerelease --title "Godot proof run ${{ github.run_number }}" --notes "Cloud-built minimal Godot 4.5 game: web export + debug APK." godot-proof-web.zip build/android/godot-proof-debug.apk
