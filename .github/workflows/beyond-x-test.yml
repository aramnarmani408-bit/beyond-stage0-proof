# BEYOND X test — cloud build workflow (v2)
# Builds the stage-1 Capacitor shell (beyond-x/) into a debug APK.
# Dispatched by the BEYOND gateway (build_key input declared so the
# dispatch is accepted). Verified shell files (round 7 run #3556):
# www/index.html + www/app.js. appId com.beyondx.app.
# v2: no package-lock.json (npm install, no cache); no binaries pushed —
# launcher/splash PNGs + the Gradle wrapper are generated in CI below.
# v3: SDK setup installs platform-tools only (legacy "tools" is gone).
# v4: icons via dependency-free Node (zlib) — ImageMagick is NOT on
# ubuntu-26.04 runners (run #44723211977 failed on "convert not found").
# v5: wrapper files downloaded directly — never run the runner's system
# Gradle 9.9.1 on the project (AGP 8.13.0 breaks on Gradle 9.6+).

name: BEYOND X test (debug APK)

on:
  push:
    branches: [beyond-x-test]
  workflow_dispatch:
    inputs:
      build_key:
        description: "BEYOND build key (idempotency)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: beyond-x
        run: npm install

      - name: Sync web assets into the Android project
        working-directory: beyond-x
        run: npx cap sync android

      - name: Set up JDK 17 (required by AGP 8.13.0)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 fix (run #44722472228 failed in 19s): the action's DEFAULT
          # packages list ("tools platform-tools") asks sdkmanager for the
          # legacy "tools" package, which no longer exists in the SDK repo
          # ("Failed to find package 'tools'", exit 1). Install only
          # platform-tools; the runner already ships cmdline-tools.
          packages: platform-tools

      - name: Generate launcher + splash icons
        run: |
          cd beyond-x/android/app/src/main/res
          mkdir -p mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi drawable drawable-land-mdpi drawable-land-hdpi drawable-land-xhdpi drawable-land-xxhdpi drawable-land-xxxhdpi drawable-port-mdpi drawable-port-hdpi drawable-port-xhdpi drawable-port-xxhdpi drawable-port-xxxhdpi
          # v4 fix (run #44723211977 failed in 16s): ImageMagick "convert"
          # is NOT installed on ubuntu-26.04 runners. Generate the 26
          # solid-color PNGs with dependency-free Node (zlib) instead —
          # verified locally: 26/26 valid PNGs, correct sizes + colors.
          cat > /tmp/gen-icons.js <<'EOF'
          const fs = require('fs'), zlib = require('zlib');
          const T = new Int32Array(256);
          for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c; }
          const crc = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
          const chk = (t, d) => { const l = Buffer.alloc(4); l.writeUInt32BE(d.length); const b = Buffer.from(t), r = Buffer.alloc(4); r.writeUInt32BE(crc(Buffer.concat([b, d]))); return Buffer.concat([l, b, d, r]); };
          const png = (s, r, g, b) => { const row = Buffer.alloc(1 + s * 3); for (let x = 0; x < s; x++) { row[1 + x * 3] = r; row[2 + x * 3] = g; row[3 + x * 3] = b; } const raw = Buffer.concat(Array(s).fill(row)); const h = Buffer.alloc(13); h.writeUInt32BE(s, 0); h.writeUInt32BE(s, 4); h[8] = 8; h[9] = 2; return Buffer.concat([Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]), chk('IHDR', h), chk('IDAT', zlib.deflateSync(raw)), chk('IEND', Buffer.alloc(0))]); };
          const A = png(192, 0, 245, 255), B = png(512, 5, 5, 16);
          for (const d of ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']) for (const n of ['ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground']) fs.writeFileSync(`mipmap-${d}/${n}.png`, A);
          for (const q of ['', '-land-mdpi', '-land-hdpi', '-land-xhdpi', '-land-xxhdpi', '-land-xxxhdpi', '-port-mdpi', '-port-hdpi', '-port-xhdpi', '-port-xxhdpi', '-port-xxxhdpi']) fs.writeFileSync(`drawable${q}/splash.png`, B);
          EOF
          node /tmp/gen-icons.js
          test $(find . -name '*.png' | wc -l) -eq 26

      - name: Generate Gradle wrapper
        working-directory: beyond-x/android
        run: |
          # v5 fix (run #44723592183 failed in 52s): NEVER run the runner's
          # system Gradle (9.9.1) against this project — "gradle wrapper"
          # evaluates it first and AGP 8.13.0 breaks on Gradle 9.6+ (an
          # internal API it uses was removed). Download the wrapper files
          # for 8.14.3 directly instead; ./gradlew then runs 8.14.3.
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradlew
          curl -fsSL -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradlew.bat
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          ls -la gradlew gradle/wrapper/gradle-wrapper.jar

      - name: Build debug APK
        working-directory: beyond-x/android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beyond-x-test-debug-apk
          path: beyond-x/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
